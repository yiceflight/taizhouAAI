name: Build and publish release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.9.0'

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          tag="$REF_NAME"
          version="${tag#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$package_version" == "$version" ]] || { echo "package.json is $package_version, release is $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  validate:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  build-macos:
    needs: [metadata, validate]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build universal macOS updater artifact
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target universal-apple-darwin
      - name: Collect macOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf staging
          mkdir -p staging
          find "src-tauri/target/universal-apple-darwin/release/bundle" -type f \( -name '*.tar.gz' -o -name '*.tar.gz.sig' \) -exec cp {} staging/ \;
          files=(staging/*.tar.gz staging/*.tar.gz.sig)
          ((${#files[@]} == 2)) || { echo "Expected one macOS tar.gz and one signature" >&2; find staging -maxdepth 1 -type f -print; exit 1; }
          ls -l staging
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: staging/
          if-no-files-found: error

  build-windows:
    needs: [metadata, validate]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rustup target add x86_64-pc-windows-msvc
      - name: Build Windows x64 updater artifact
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis
      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Recurse -Force staging -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force staging | Out-Null
          $bundle = 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle'
          Get-ChildItem -Path $bundle -Recurse -File -Filter '*-setup.exe' | Copy-Item -Destination staging
          Get-ChildItem -Path $bundle -Recurse -File -Filter '*-setup.exe.sig' | Copy-Item -Destination staging
          $files = @(Get-ChildItem staging -File)
          if ($files.Count -ne 2) { Get-ChildItem staging; throw 'Expected one Windows installer and one signature' }
          if (-not ($files.Name -match '_${{ needs.metadata.outputs.version }}_x64-setup\.exe')) { Get-ChildItem staging; throw 'Windows installer filename must contain version and x64 target' }
          Get-ChildItem staging
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: staging/
          if-no-files-found: error

  publish:
    needs: [metadata, build-macos, build-windows]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: staging
          merge-multiple: true
      - name: Verify and publish to Alibaba Cloud OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_DOMAIN: ${{ secrets.OSS_DOMAIN }}
        run: pnpm oss:publish staging "${{ needs.metadata.outputs.version }}"
      - name: Create GitHub release record
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ needs.metadata.outputs.tag }}" staging/* --title "泰州市监测中心智能监测系统 ${{ needs.metadata.outputs.version }}" --generate-notes
