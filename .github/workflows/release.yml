name: Build clients and publish tagged releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.9.0'

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      source_ref: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          tag="v$package_version"
          if [[ "$EVENT_NAME" == "push" ]]; then tag="$REF_NAME"; fi
          version="${tag#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$package_version" == "$version" ]] || { echo "package.json is $package_version, release is $version" >&2; exit 1; }
          node --input-type=module -e 'import fs from "node:fs"; const v = JSON.parse(fs.readFileSync("package.json")).version; const tauri = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json")).version; const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"/m)?.[1]; if (v !== tauri || v !== cargo) throw new Error("Client versions must match");'
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  validate:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.source_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:ui
      - run: pnpm build

  build-macos:
    needs: [metadata, validate]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.source_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build universal macOS updater artifact
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target universal-apple-darwin
      - name: Collect macOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf staging
          mkdir -p staging
          find "src-tauri/target/universal-apple-darwin/release/bundle" -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.tar.gz.sig' \) -exec cp {} staging/ \;
          for pattern in '*.dmg' '*.tar.gz' '*.tar.gz.sig'; do
            count=$(find staging -maxdepth 1 -type f -name "$pattern" | wc -l | tr -d ' ')
            [[ "$count" == 1 ]] || { echo "Expected one $pattern artifact" >&2; exit 1; }
          done
          ls -l staging
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: staging/
          if-no-files-found: error

  build-windows:
    needs: [metadata, validate]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.source_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rustup target add x86_64-pc-windows-msvc
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build Windows x64 updater artifact
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis
      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Recurse -Force staging -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force staging | Out-Null
          $bundle = 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle'
          Get-ChildItem -Path $bundle -Recurse -File -Filter '*-setup.exe' | Copy-Item -Destination staging
          Get-ChildItem -Path $bundle -Recurse -File -Filter '*-setup.exe.sig' | Copy-Item -Destination staging
          $files = @(Get-ChildItem staging -File)
          if ($files.Count -ne 2) { Get-ChildItem staging; throw 'Expected one Windows installer and one signature' }
          if (-not ($files.Name -match '_${{ needs.metadata.outputs.version }}_x64-setup\.exe')) { Get-ChildItem staging; throw 'Windows installer filename must contain version and x64 target' }
          Get-ChildItem staging
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: staging/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: [metadata, build-macos, build-windows]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.source_ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: staging
          merge-multiple: true
      - name: Verify and publish to Alibaba Cloud OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_DOMAIN: ${{ secrets.OSS_DOMAIN }}
          OSS_TIMEOUT_MS: '300000'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if pnpm oss:publish staging "${{ needs.metadata.outputs.version }}"; then
              exit 0
            fi
            echo "OSS publish attempt $attempt failed; retrying after a short delay" >&2
            sleep 10
          done
          exit 1
      - name: Create GitHub release record
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ needs.metadata.outputs.tag }}" staging/* --title "江苏省泰州环境监测中心智能监测系统 ${{ needs.metadata.outputs.version }}" --generate-notes
