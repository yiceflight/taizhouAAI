[package]
name = "taizhou-aai"
version = "0.2.20"
description = "江苏省泰州环境监测中心智能监测系统 browser automation desktop client"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "taizhou_aai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
test-environment = []

[build-dependencies]
cc = "1"
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1"
base64 = "0.22"
zip = { version = "4.6", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
axum = "0.8"
tokio = { version = "1", features = ["net", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
kamadak-exif = "0.6"
quick-xml = "0.42"
sha2 = "0.10"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
mozjpeg = { version = "0.10.13", default-features = false }
jpegli = "0.1.0"
mozjpeg-sys = { version = "2.2.3", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# CMake Debug links MSVC debug CRT symbols absent from Rust test executables.
# Build this native dependency with the release CRT even in debug/test profiles.
[profile.dev.package.jpegli-sys]
opt-level = 2
debug = false
