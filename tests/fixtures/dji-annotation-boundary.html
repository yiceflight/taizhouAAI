<!doctype html><html><head><meta charset="utf-8"><title>标注边界验证</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"PingFang SC",sans-serif;background:#292929;color:white}#controls{position:fixed;top:10px;left:20px;z-index:1000}button{padding:8px 20px}.detail-content{margin:70px 20px 0;width:850px}.view{height:640px;width:850px;overflow:hidden;background:#111}.photo-wrapper{position:relative;width:850px;height:640px;overflow:hidden;background:#111}.viewer-canvas>img{position:absolute;left:25px;top:0;width:800px;height:640px}.doodle-list-container{position:absolute;left:25px;top:0;width:800px;height:640px;overflow:hidden}.wrapper{position:absolute}.point-icon{width:24px;height:24px}.point-icon svg{display:block;width:16px;height:16px;margin-top:4px}.text{position:absolute;top:28px;left:0;font-size:16px;line-height:20px;white-space:nowrap;color:black;text-shadow:1px 1px white,-1px 1px white,1px -1px white,-1px -1px white}.detail-desc-tag-row{position:absolute;left:900px;top:100px}#status{position:fixed;left:900px;top:140px;width:400px;white-space:pre-wrap;font:14px monospace}
</style></head><body><svg id="__SVG_SPRITE_NODE__" style="position:absolute;width:0;height:0"><symbol id="ai-point" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7"/></symbol></svg><div id="controls"><button id="prepare" disabled>合成准备</button> <button id="restore">恢复</button></div><div class="show-area"><div class="detail-content"><div class="photo-name">DJI_20261025170814_0004_T</div><div class="view"><div class="photo-wrapper"><div class="viewer-js-container"><div class="viewer-canvas"><img id="photo"></div></div><div class="doodle-list-container"><div class="wrapper" style="left:15px;top:-10px"><div class="point-icon"><svg viewBox="0 0 16 16"><use href="#ai-point" fill="#e23c39"/></svg></div><div class="text" style="left:-40px">最高温度: 25.6℃</div></div><div class="wrapper" style="left:780px;top:625px"><div class="point-icon"><svg viewBox="0 0 16 16"><use href="#ai-point" fill="#2d8cf0"/></svg></div><div class="text">最低温度: -1.6℃</div></div></div><div class="hotspot-wrapper"><div class="uranus-hot-spot-container-wrapper"></div></div></div></div></div><aside class="detail-desc-tag-row"><span class="tag-sum">2</span></aside></div><pre id="status">Loading</pre><script type="module">
import {djiPhotoPresentation} from '/extension/src/dji-photo-presentation.js';
const name='DJI_20261025170814_0004_T.jpeg', job={name,width:1280,height:1024},captureId=crypto.randomUUID();
const status=document.querySelector('#status'),controls=document.querySelector('#controls'),img=document.querySelector('#photo');
const canvas=document.createElement('canvas');canvas.width=1280;canvas.height=1024;const c=canvas.getContext('2d');
for(let y=0;y<1024;y+=64)for(let x=0;x<1280;x+=64){c.fillStyle=((x+y)/64)%2?'#683bb0':'#bb467a';c.fillRect(x,y,64,64)}
c.strokeStyle='#fff';c.lineWidth=4;c.strokeRect(2,2,1276,1020);
img.onload=()=>{status.textContent='READY';document.querySelector('#prepare').disabled=false;};img.src=canvas.toDataURL('image/png');
document.querySelector('#prepare').onclick=async()=>{try{const plan=await djiPhotoPresentation(job);const ready=await djiPhotoPresentation({...job,phase:'prepare',signature:plan.signature,captureId});const checked=await djiPhotoPresentation({...job,phase:'capture-inspect',captureId,signature:ready.signature,captureGeometry:{width:ready.width,height:ready.height,imageRect:ready.imageRect}});status.textContent=JSON.stringify({result:'PASS',spriteVisible:getComputedStyle(document.querySelector('#__SVG_SPRITE_NODE__')).visibility==='visible',sourceSignatureMatches:ready.sourceSignature===plan.signature,stable:checked.signature===ready.signature,width:ready.width,height:ready.height,imageRect:ready.imageRect,clip:ready.clip,labels:ready.labels},null,2);}catch(e){status.textContent='FAIL: '+e.message;}finally{status.style.setProperty('visibility','visible','important');controls.style.setProperty('visibility','visible','important');}};
document.querySelector('#restore').onclick=async()=>{await djiPhotoPresentation({phase:'restore',captureId});status.textContent='RESTORED';};
</script></body></html>
